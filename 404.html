<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa bulunamadı | Kumbasar Çelik Dövme</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="stylesheet" href="/css/style.css">
<style>
  .notfound { min-height: 100vh; display: flex; align-items: center; background: var(--steel); color: var(--on-dark); }
  .notfound h1 { color: var(--white); margin: 0 0 16px; }
  .notfound p { color: var(--on-dark-2); max-width: 52ch; margin: 0 0 28px; }
  .notfound .actions { display: flex; flex-wrap: wrap; gap: 12px; }
</style>
</head>
<body>
<main class="notfound">
  <div class="wrap">
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Sitemiz yenilendi; bu adres artık kullanılmıyor. Ana sayfadan devam edebilir ya da bize doğrudan ulaşabilirsiniz.</p>
    <div class="actions">
      <a class="btn btn-red" href="/">Ana sayfaya dön</a>
      <a class="btn btn-line" href="/#iletisim">İletişim</a>
    </div>
  </div>
</main>
</body>
</html>
